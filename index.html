<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>B3A 富泰邨 ↔ 深圳灣口岸</title>
<style>
  :root {
    --bg: #0f1115;
    --card: #171a21;
    --card-2: #1e222b;
    --fg: #eef1f6;
    --muted: #8b93a3;
    --accent: #ffd23f;
    --accent-2: #35c46a;
    --line: #262b36;
    --err: #ff6b6b;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f2f4f8;
      --card: #ffffff;
      --card-2: #f7f9fc;
      --fg: #171a21;
      --muted: #6b7383;
      --accent: #b98600;
      --accent-2: #14883f;
      --line: #e3e7ee;
      --err: #d92d20;
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--bg);
    color: var(--fg);
    font-family: "PingFang HK", "Microsoft JhengHei", "Noto Sans HK",
                 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    -webkit-font-smoothing: antialiased;
    display: flex;
    justify-content: center;
    padding: 24px 16px 40px;
  }
  .wrap { width: 100%; max-width: 560px; }

  /* ---------- page header ---------- */
  header.page { margin-bottom: 20px; }
  .route { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .route-no {
    background: var(--accent);
    color: #171a21;
    font-weight: 800;
    font-size: 22px;
    letter-spacing: .5px;
    padding: 6px 14px;
    border-radius: 10px;
    line-height: 1;
  }
  .op { font-size: 13px; color: var(--muted); }
  .page h1 { font-size: 19px; margin: 0; font-weight: 700; letter-spacing: .3px; }
  .page h1 .arrow { color: var(--accent-2); }

  /* ---------- direction board ---------- */
  .board {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
  }
  .board-head { margin-bottom: 12px; }
  .tag {
    display: inline-block;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: .6px;
    text-transform: uppercase;
    padding: 3px 9px;
    border-radius: 999px;
    margin-bottom: 9px;
  }
  .tag.out { background: rgba(53, 196, 106, .16); color: var(--accent-2); }
  .tag.in  { background: rgba(255, 210, 63, .18); color: var(--accent); }
  .board-route { font-size: 19px; font-weight: 700; line-height: 1.35; }
  .board-route .arrow { color: var(--accent-2); font-weight: 600; }
  .board-stops {
    font-size: 12px;
    color: var(--muted);
    margin-top: 5px;
    line-height: 1.6;
  }
  .board-stops .k { opacity: .75; }
  .board-stops .en { opacity: .8; }

  .grid { display: flex; flex-direction: column; gap: 8px; }

  .bus {
    background: var(--card-2);
    border: 1px solid var(--line);
    border-radius: 12px;
    padding: 11px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    min-height: 70px;
  }
  .bus .rank {
    width: 26px; height: 26px; flex: 0 0 26px;
    border-radius: 50%;
    background: var(--card);
    border: 1px solid var(--line);
    color: var(--muted);
    font-size: 12px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .bus.first { border-color: var(--accent-2); }
  .bus.first .rank { background: var(--accent-2); border-color: var(--accent-2); color: #fff; }
  .bus .mins { flex: 1 1 auto; display: flex; align-items: baseline; gap: 7px; min-width: 0; }
  .bus .num {
    font-size: 34px; font-weight: 800; line-height: 1;
    letter-spacing: -1px; font-variant-numeric: tabular-nums;
  }
  .bus .unit { font-size: 14px; color: var(--muted); font-weight: 600; }
  .bus .unit .en { font-size: 10px; display: block; font-weight: 500; opacity: .8; }
  .bus .due .num { font-size: 23px; letter-spacing: 0; }
  .bus .when { text-align: right; flex: 0 0 auto; font-size: 11px; color: var(--muted); }
  .bus .when .clock {
    font-size: 18px; color: var(--fg); font-weight: 700;
    font-variant-numeric: tabular-nums; display: block; line-height: 1.35;
  }
  .bus .rmk { flex-basis: 100%; font-size: 12px; color: var(--accent); }

  .empty {
    background: var(--card-2);
    border: 1px dashed var(--line);
    border-radius: 12px;
    padding: 22px 14px;
    text-align: center;
    color: var(--muted);
    font-size: 13px;
    line-height: 1.7;
  }
  .empty strong { color: var(--fg); display: block; font-size: 14px; margin-bottom: 1px; }

  .board-foot {
    margin-top: 12px;
    padding-top: 10px;
    border-top: 1px solid var(--line);
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    font-size: 11px; color: var(--muted);
  }
  .status { display: flex; align-items: center; gap: 6px; }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--accent-2); flex: 0 0 7px; }
  .dot.stale { background: var(--muted); }
  .dot.err { background: var(--err); }

  footer.page {
    display: flex; align-items: center; justify-content: space-between;
    gap: 10px; font-size: 12px; color: var(--muted);
  }
  button {
    font: inherit; font-size: 12px; color: var(--fg);
    background: var(--card); border: 1px solid var(--line);
    border-radius: 8px; padding: 6px 12px; cursor: pointer;
  }
  button:hover { background: var(--card-2); }
  .src { font-size: 11px; color: var(--muted); margin-top: 12px; line-height: 1.6; }
</style>
</head>
<body>
<div class="wrap">
  <header class="page">
    <div class="route">
      <span class="route-no">B3A</span>
      <span class="op">城巴 Citybus</span>
    </div>
    <h1>富泰邨 <span class="arrow">↔</span> 深圳灣口岸</h1>
  </header>

  <main id="boards"></main>

  <footer class="page">
    <span id="updated">—</span>
    <button id="refresh" type="button">立即更新 Refresh</button>
  </footer>

  <div class="src">
    每 30 秒自動更新 · Auto-refresh every 30 seconds<br>
    資料來源：城巴 Citybus 開放數據 (DATA.GOV.HK) · rt.data.gov.hk
  </div>
</div>

<script>
(function () {
  "use strict";

  var BASE = "https://rt.data.gov.hk/v2/transport/citybus/eta/CTB/";
  var REFRESH_MS = 30000;
  var ROUTE = "B3A";

  var BOARDS = [
    {
      key: "out",
      tag: "去程 Outbound",
      from: "富泰邨",
      to: "深圳灣口岸",
      boardStop: "富泰邨, 青山公路",
      boardStopEn: "Fu Tai Estate, Castle Peak Road",
      alightStop: "深圳灣口岸",
      alightStopEn: "Shenzhen Bay Port",
      stopId: "003261",
      dir: "O"
    },
    {
      key: "in",
      tag: "回程 Return",
      from: "深圳灣口岸",
      to: "富泰邨",
      boardStop: "深圳灣口岸",
      boardStopEn: "Shenzhen Bay Port",
      alightStop: "富泰商場, 青山公路",
      alightStopEn: "Fu Tai Shopping Centre, Castle Peak Road",
      stopId: "003208",
      dir: "I"
    }
  ];

  var hkTime = new Intl.DateTimeFormat("zh-HK", {
    hour: "2-digit", minute: "2-digit", hour12: false, timeZone: "Asia/Hong_Kong"
  });
  var hkStamp = new Intl.DateTimeFormat("zh-HK", {
    hour: "2-digit", minute: "2-digit", second: "2-digit",
    hour12: false, timeZone: "Asia/Hong_Kong"
  });

  var updatedEl = document.getElementById("updated");

  function el(tag, cls, text) {
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text != null) n.textContent = text;
    return n;
  }

  function buildBoard(cfg) {
    var section = el("section", "board");

    var head = el("div", "board-head");
    head.appendChild(el("span", "tag " + cfg.key, cfg.tag));

    var r = el("div", "board-route");
    r.appendChild(document.createTextNode(cfg.from));
    r.appendChild(el("span", "arrow", " → "));
    r.appendChild(document.createTextNode(cfg.to));
    head.appendChild(r);

    var stops = el("div", "board-stops");
    stops.appendChild(el("span", "k", "上車 "));
    stops.appendChild(document.createTextNode(cfg.boardStop + " "));
    stops.appendChild(el("span", "en", "(" + cfg.boardStopEn + ")"));
    stops.appendChild(document.createElement("br"));
    stops.appendChild(el("span", "k", "落車 "));
    stops.appendChild(document.createTextNode(cfg.alightStop + " "));
    stops.appendChild(el("span", "en", "(" + cfg.alightStopEn + ")"));
    head.appendChild(stops);

    section.appendChild(head);

    var grid = el("div", "grid");
    section.appendChild(grid);

    var foot = el("div", "board-foot");
    var status = el("div", "status");
    var dot = el("span", "dot stale");
    var statusText = el("span", null, "正在載入 Loading…");
    status.appendChild(dot);
    status.appendChild(statusText);
    foot.appendChild(status);
    section.appendChild(foot);

    var state = {
      cfg: cfg,
      grid: grid,
      dot: dot,
      statusText: statusText,
      ok: false,
      lastUpdate: "—",
      nextRefreshAt: 0
    };

    return { section: section, state: state };
  }

  function renderBuses(state, list) {
    var grid = state.grid;
    grid.textContent = "";

    if (!list.length) {
      var box = el("div", "empty");
      box.appendChild(el("strong", null, "暫時沒有預定班次"));
      box.appendChild(document.createTextNode("No upcoming buses scheduled"));
      grid.appendChild(box);
      return;
    }

    list.forEach(function (eta, i) {
      var mins = Math.round((new Date(eta.eta).getTime() - Date.now()) / 60000);
      var due = mins <= 0;

      var card = el("div", "bus" + (i === 0 ? " first" : ""));
      card.appendChild(el("div", "rank", String(i + 1)));

      var minsWrap = el("div", "mins");
      if (due) {
        var dw = el("div", "due");
        dw.appendChild(el("span", "num", "即將到站"));
        minsWrap.appendChild(dw);
        minsWrap.appendChild(el("span", "unit", "Due"));
      } else {
        minsWrap.appendChild(el("span", "num", String(mins)));
        var unit = el("span", "unit", "分鐘");
        unit.appendChild(el("span", "en", "min"));
        minsWrap.appendChild(unit);
      }
      card.appendChild(minsWrap);

      var when = el("div", "when");
      when.appendChild(el("span", "clock", hkTime.format(new Date(eta.eta))));
      when.appendChild(el("span", null, "預計 Arrival"));
      card.appendChild(when);

      var rmk = (eta.rmk_tc || "").trim();
      var rmkEn = (eta.rmk_en || "").trim();
      if (rmk || rmkEn) {
        card.appendChild(el("div", "rmk", rmk + (rmkEn && rmkEn !== rmk ? " · " + rmkEn : "")));
      }

      grid.appendChild(card);
    });
  }

  var boards = [];
  var boardsEl = document.getElementById("boards");

  BOARDS.forEach(function (cfg) {
    var b = buildBoard(cfg);
    boardsEl.appendChild(b.section);
    boards.push(b.state);
  });

  function refreshBoard(state) {
    var cfg = state.cfg;
    state.nextRefreshAt = Date.now() + REFRESH_MS;

    fetch(BASE + cfg.stopId + "/" + ROUTE, { cache: "no-store" })
      .then(function (res) {
        if (!res.ok) throw new Error("HTTP " + res.status);
        return res.json();
      })
      .then(function (json) {
        var list = (json.data || [])
          .filter(function (e) { return e.dir === cfg.dir && e.eta; })
          .sort(function (a, b) { return new Date(a.eta) - new Date(b.eta); });
        renderBuses(state, list);
        state.lastUpdate = hkStamp.format(new Date());
        state.ok = true;
        state.nextRefreshAt = Date.now() + REFRESH_MS;
        tick();
      })
      .catch(function (err) {
        state.ok = false;
        state.dot.className = "dot err";
        state.statusText.textContent = "無法取得數據，重試中 · " + err.message;
        if (!state.grid.querySelector(".bus")) {
          state.grid.textContent = "";
          var box = el("div", "empty");
          box.appendChild(el("strong", null, "未能載入班次"));
          box.appendChild(document.createTextNode("Could not load ETA data · retrying"));
          state.grid.appendChild(box);
        }
      });
  }

  function refreshAll() {
    boards.forEach(refreshBoard);
  }

  function tick() {
    var newest = null;
    boards.forEach(function (state) {
      if (state.ok) {
        state.dot.className = "dot";
        var s = Math.max(0, Math.round((state.nextRefreshAt - Date.now()) / 1000));
        state.statusText.textContent = "已更新 " + state.lastUpdate + " · " + s + " 秒後更新";
        if (newest === null || state.lastUpdate > newest) newest = state.lastUpdate;
      }
    });
    if (newest !== null) updatedEl.textContent = "頁面更新於 Updated " + newest;
  }

  document.getElementById("refresh").addEventListener("click", refreshAll);

  refreshAll();
  setInterval(refreshAll, REFRESH_MS);
  setInterval(tick, 1000);
})();
</script>
</body>
</html>
